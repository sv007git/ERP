name: Variant A CI - Supabase & Frontend

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: variant-a-supabase/package-lock.json

      - name: Install dependencies
        working-directory: variant-a-supabase
        run: npm ci || npm install

      - name: Type Check TypeScript
        working-directory: variant-a-supabase
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        working-directory: variant-a-supabase
        run: npm run test

      - name: Production Build
        working-directory: variant-a-supabase
        run: npm run build
